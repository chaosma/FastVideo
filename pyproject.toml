[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastvideo"
version = "0.2.0"
description = "Minimal Wan-only fork of FastVideo: parquet preprocessing + YAML-driven training"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    # Core
    "requests>=2.32.2",
    "scipy==1.14.1",          # used by FlowMatchEulerDiscreteScheduler

    # ML / Transformers / Diffusers
    "transformers==4.57.3",
    "tokenizers>=0.20.1",
    "sentencepiece==0.2.0",
    "diffusers>=0.33.1",
    "accelerate==1.0.1",
    "torch>=2.10.0",
    "torchvision",
    "torchaudio",
    "einops",
    "cloudpickle",            # used by fastvideo.models.registry (subprocess model probing)
    "remote-pdb",             # used by fastvideo.utils.remote_breakpoint (debug helper)

    # Image / video I/O for preprocessing
    "pillow>=10.3.0",
    "opencv-python==4.10.0.84",
    "imageio==2.36.0",
    "imageio-ffmpeg==0.5.1",
    "av",                     # PyAV — preprocessing video reads

    # Tracking / logging
    "wandb>=0.21.0",
    "loguru",

    # Misc utilities
    "tqdm",
    "PyYAML==6.0.1",
    "protobuf>=5.28.3",
    "huggingface_hub",
    "ftfy==6.3.1",            # text cleaning during preprocessing

    # Training dataloader
    "torchdata",
    "pyarrow",
    "datasets==4.0.0",        # workflow/preprocess/components.py

    # Distributed preprocess driver
    "ray>=2.49.1",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]

# flash-attn: pip install flash-attn==2.8.1 --no-cache-dir --no-build-isolation


lint = [
    "pre-commit==4.0.1",
    "types-aiofiles",
    "types-requests",
]

test = [
    "av",
    "pytorch-msssim==1.0.0",
    "pytest",
]

dev = [ "fastvideo[lint]", "fastvideo[test]", ]

rocm = [
    "amdsmi",
]

[project.scripts]
fastvideo = "fastvideo.entrypoints.cli.main:main"

[tool.setuptools.packages.find]
exclude = ["assets*", "docker*", "docs", "scripts*"]

[tool.wheel]
exclude = ["assets*", "docker*", "docs", "scripts*"]


[tool.mypy]
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_calls = true
check_untyped_defs = true
follow_imports = "silent"

[tool.codespell]
skip = "./data,./wandb,ui/package-lock.json"

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    # "I",
    "G",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
    # line too long
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Ignore all files that end in `_test.py`.
"fastvideo/models/hunyuan/diffusion/pipelines/pipeline_hunyuan_video.py" = ["E741"]


[tool.yapf]
column_limit = 120

[tool.isort]
line_length = 120
use_parentheses = true
skip_gitignore = true


[project.urls]
Repository = "https://github.com/hao-ai-lab/FastVideo"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "fastvideo"
DisplayName = "FastVideo"
Icon = "https://raw.githubusercontent.com/hao-ai-lab/FastVideo/main/comfyui/assets/icon_simple.svg"
