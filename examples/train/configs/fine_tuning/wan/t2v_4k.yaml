# Wan 2.1 T2V 1.3B — 4K fine-tune (milestone: one training step without crash)
#
# Rung ladder (climb down if OOM — change num_height/num_width/num_frames/num_latent_t together):
#   Rung 0:  3840×2160, 77 frames, num_latent_t=20  ← final target (matches Wan2.1 native length)
#   Rung 1:  3840×2160, 17 frames, num_latent_t=5
#   Rung 2:  3840×2160,  5 frames, num_latent_t=2   ← DEFAULT START
#   Rung 3:  3840×2160,  1 frame,  num_latent_t=1   (image mode)
#   Rung 4:  2560×1440,  1 frame,  num_latent_t=1
#   Rung 5:  1920×1080,  1 frame,  num_latent_t=1
#
# Latent math (Wan VAE: spatial_stride=8, temporal_stride=4, z_dim=16):
#   spatial latent:  3840/8=480 wide,  2160/8=270 tall
#   temporal latent: (num_frames-1)/4 + 1  (must satisfy: (num_frames-1) % 4 == 0)
#   token count:     (270/2) × (480/2) × num_latent_t  (patch_size=2×2)
#     Rung 2: 135 × 240 × 2 = 64,800 tokens  (tractable with flash-attn)
#     Rung 0: 135 × 240 × 21 = 680,400 tokens  (needs SP or VSA)
#
# Before running:
#   1. Run preprocess_4k.sh to produce data/preprocessed_4k/ parquet files.
#   2. (Optional) Run make_synthetic_4k_data.py to create fake data for plumbing checks.
#   3. dry-run: bash examples/train/run.sh <this file> --dry-run --training.distributed.num_gpus 1

models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: true

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  distributed:
    num_gpus: 1          # single-GPU start; increase + set sp_size for multi-GPU SP
    sp_size: 1           # sequence parallelism: set to num_gpus to halve per-GPU activation memory
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 1

  data:
    data_path: data/preprocessed_4k          # output of preprocess_4k.sh
    dataloader_num_workers: 2
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    # ── Rung 2: 4K, 5 frames ──────────────────────────────────────────────
    num_latent_t: 2      # (5-1)/4 + 1 = 2
    num_height: 2160
    num_width: 3840
    num_frames: 5
    # ── Rung 0 (comment in when hardware allows) ──────────────────────────
    # num_latent_t: 20
    # num_height: 2160
    # num_width: 3840
    # num_frames: 77

  optimizer:
    learning_rate: 1.0e-6
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 1                      # start with 1 step; set to 50-100 for overfit test
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/wan_finetune_4k
    training_state_checkpointing_steps: 50  # save every 50 steps once you run longer
    checkpoints_total_limit: 3
    resume_from_checkpoint: latest

  tracker:
    project_name: fastvideo
    run_name: wan_finetune_4k_rung2

  model:
    enable_gradient_checkpointing_type: full  # essential at 4K — recomputes activations

# Validation callback DISABLED for milestone (runs full inference at training res → OOM risk).
# Re-enable after milestone is confirmed by uncommenting and providing a dataset_file.
callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  # validation:
  #   _target_: fastvideo.train.callbacks.validation.ValidationCallback
  #   pipeline_target: fastvideo.pipelines.basic.wan.wan_pipeline.WanPipeline
  #   dataset_file: data/validation_prompts_4k.json
  #   every_steps: 100
  #   sampling_steps: [50]
  #   guidance_scale: 5.0

pipeline:
  flow_shift: 3
